<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="필투두">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>필투두</title>
<script>
/* PC 앱 창이 제목 표시줄을 숨기고 그 자리를 앱에 내줬는지(창 제어 오버레이) — 맞으면 비즈니스 칸을 그 자리에 올린다 */
(function () { var o = navigator.windowControlsOverlay; function f() { document.documentElement.classList.toggle("wco", !!(o && o.visible)); } if (o) o.addEventListener("geometrychange", f); f(); })();
</script>
<script>
/* 올릴 때마다 번호를 붙여 폰·PC가 옛 파일을 다시 쓰지 않게 한다(배포 때 "dev" 를 배포 번호로 바꾼다) */
var PT_BUILD = "1120-0939", PT_V = PT_BUILD === "dev" ? Date.now() : PT_BUILD;
document.write('<link rel="stylesheet" href="style.css?v=' + PT_V + '">');
</script>
</head>
<body>
<div class="chrome">
<!-- 맨 윗줄 = 사장님 비즈니스 칸(config.js 의 PT_BIZ). PC 앱 창에서는 제목 표시줄 자리에 들어간다 -->
<div class="bizbar" id="bizbar" aria-label="사업"></div>
<header class="top">
  <button class="brand" data-view="todo" aria-label="할 일로"><img class="mark" src="icon-192.png" alt="" width="34" height="34"><span>필투두</span></button>
  <label class="hs"><span aria-hidden="true">🔍</span><input id="fq" type="search" placeholder="무엇이든 찾기" enterkeyhint="search" autocomplete="off" aria-label="필투두 전체에서 찾기"></label>
  <button id="saveBtn" class="savebtn" type="button" data-act="saveall" title="지금 화면(체크·입력·펼친 카드·보던 자리) 저장">💾 저장</button>
  <nav>
    <button data-view="todo">할 일 <b id="navTodo">0</b></button>
    <button data-view="done">한 일</button>
    <button data-view="idea" class="idea-nav">💡 아이디어 <b id="navIdea">0</b></button>
    <button data-view="kl">클실장</button>
    <button data-view="set">설정</button>
  </nav>
</header>
</div>
<main id="app"></main>
<p id="ver" class="foot"></p>
<div id="toast" role="status" aria-live="polite"></div>
<script>
["config.js", "app.js"].forEach(function (f) { document.write('<script src="' + f + '?v=' + PT_V + '"><\/script>'); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
