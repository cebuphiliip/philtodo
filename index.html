<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213D">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="필투두">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>필투두</title>
<script>
/* 올릴 때마다 번호를 붙여 폰·PC가 옛 파일을 다시 쓰지 않게 한다(배포 때 "dev" 를 배포 번호로 바꾼다) */
var PT_BUILD = "1119-2109", PT_V = PT_BUILD === "dev" ? Date.now() : PT_BUILD;
document.write('<link rel="stylesheet" href="style.css?v=' + PT_V + '">');
</script>
</head>
<body>
<header class="top">
  <button class="brand" data-view="todo" aria-label="할 일로"><span class="mark">P</span><span>필투두<small>사장님 ↔ 클실장</small></span></button>
  <label class="hs"><span aria-hidden="true">🔍</span><input id="fq" type="search" placeholder="무엇이든 찾기" enterkeyhint="search" autocomplete="off" aria-label="필투두 전체에서 찾기"></label>
  <button id="saveBtn" class="savebtn" type="button" data-act="saveall" title="지금 화면(체크·입력·펼친 카드·보던 자리) 저장">💾 저장</button>
  <nav>
    <button data-view="todo">할 일 <b id="navTodo">0</b></button>
    <button data-view="done">한 일</button>
    <button data-view="idea" class="idea-nav">💡 아이디어 <b id="navIdea">0</b></button>
    <button data-view="kl">클실장</button>
    <button data-view="set">설정</button>
  </nav>
</header>
<main id="app"></main>
<p id="ver" class="foot"></p>
<div id="toast" role="status" aria-live="polite"></div>
<script>
["config.js", "app.js"].forEach(function (f) { document.write('<script src="' + f + '?v=' + PT_V + '"><\/script>'); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
